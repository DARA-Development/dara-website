<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solutions | DARA Telecom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="masthead">
  <div class="wrap">
    <div class="masthead-top">
      <div class="brand">
        <a href="index.html" aria-label="DARA Telecom home">
          <img class="brand-logo brand-logo-light" src="images/BlueOnWhite.png" alt="DARA Telecom" />
          <img class="brand-logo brand-logo-dark" src="images/WhiteBlueOnBlack.png" alt="DARA Telecom" />
        </a>
      </div>

      <form class="site-search" role="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="6"/>
          <path d="M16 16l5 5"/>
        </svg>
        <input type="search" placeholder="Search site" aria-label="Search this site" />
        <button class="site-search-submit" type="submit" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="6"/>
            <path d="m16 16 5 5"/>
          </svg>
        </button>
        <div class="site-search-results" aria-live="polite" hidden></div>
      </form>
      <a class="btn btn-outline" href="index.html#login">Portal login</a>

      <div class="nav-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
        </button>
        <a class="btn btn-outline" href="index.html#partners">Become a partner</a>
        <a class="btn btn-brand" href="index.html#demo">Contact us</a>
      </div>
    </div>

    <nav class="primary-nav">
      <div class="nav-item"><a class="nav-link" href="index.html">Home</a></div>
      <div class="nav-item"><a class="nav-link" href="solutions.html" aria-current="page">Solutions</a></div>
      <div class="nav-item"><a class="nav-link" href="products.html">Products</a></div>
      <div class="nav-item"><a class="nav-link" href="about_us.html">About us</a></div>
    </nav>
  </div>
</header>

<main>
  <div class="solutions-content-space" aria-hidden="true"></div>
  <section class="cta-band" id="contact">
    <div class="wrap">
      <div>
        <h2>Start with your network challenge</h2>
        <p>Tell us what you need to measure, understand or improve.</p>
      </div>
      <a class="btn" href="index.html#demo">Contact DARA Telecom</a>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-bottom">
      <span>&copy; 2026 DARA Telecom. All rights reserved.</span>
      <div class="legal-links">
        <a href="index.html">Home</a>
        <a href="solutions.html" aria-current="page">Solutions</a>
        <a href="products.html">Products</a>
        <a href="about_us.html">About us</a>
      </div>
    </div>
  </div>
</footer>

<script>
  (function() {
    var root = document.documentElement;
    var stored = null;
    try { stored = localStorage.getItem('dara-theme'); } catch (e) {}
    var effective = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    root.setAttribute('data-theme', effective);
  })();
  document.getElementById('themeToggle').addEventListener('click', function() {
    var root = document.documentElement;
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('dara-theme', next); } catch (e) {}
  });
</script>
<script src="site-search.js"></script>
</body>
</html>
