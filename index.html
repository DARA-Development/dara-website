<script>
  var heroBannerVideo = document.querySelector('.hero-banner-video');
  heroBannerVideo.playbackRate = 0.5;
  var heroBannerTagline = document.querySelector('.hero-banner-tagline');
  var heroSequenceCopy = document.querySelector('.hero-sequence-copy');
  var heroSequenceCount = document.querySelector('.hero-sequence-count');
  var heroSequenceHeading = heroSequenceCopy.querySelector('h1');
  var heroSequenceDescription = heroSequenceCopy.querySelector('p');
  var heroSequenceLogo = document.querySelector('.hero-sequence-logo');
  var heroBanner = document.querySelector('.hero-banner');
  var heroSequenceStarted = false;
  var heroSequenceComplete = false;
  var heroSequenceHasShownMessage = false;
  var heroMessages = [
    {
      heading: 'Reach',
      description: 'Reach places where networks struggle to cover.'
    },
    {
      heading: 'Measure',
      description: 'Capture real-world terrestrial and satellite coverage.'
    },
    {
      heading: 'Analyze',
      description: 'Turn every measurement into clear, actionable insight.'
    },
    {
      heading: 'Ready',
      description: 'Close coverage gaps. Prepare for what’s next.'
    },
    {
      heading: 'Achieve Boundless Connectivity',
      description: 'No edge. No gap. No ceiling.'
    }
  ];

  function showHeroMessage(index) {
    var message = heroMessages[index];
    heroSequenceCopy.classList.remove('is-current');
    window.setTimeout(function() {
      heroSequenceCount.textContent = String(index + 1).padStart(2, '0') + ' / ' + String(heroMessages.length).padStart(2, '0');
      heroSequenceHeading.textContent = message.heading;
      heroSequenceDescription.textContent = message.description;
      heroSequenceCopy.classList.add('is-current');
      heroSequenceHasShownMessage = true;

      if (index + 1 < heroMessages.length) {
        window.setTimeout(function() { showHeroMessage(index + 1); }, 2200);
        return;
      }

      window.setTimeout(function() {
        if (!heroSequenceComplete) {
          heroSequenceComplete = true;
          heroBanner.classList.add('is-presented');
        }
        showHeroLogo();
      }, 2200);
    }, heroSequenceHasShownMessage ? 600 : 0);
  }

  function showHeroLogo() {
    heroSequenceCopy.classList.remove('is-current');
    window.setTimeout(function() {
      heroSequenceLogo.classList.add('is-visible');
      window.setTimeout(function() {
        heroSequenceLogo.classList.remove('is-visible');
        showHeroMessage(0);
      }, 8800);
    }, 600);
  }

  heroBannerVideo.addEventListener('timeupdate', function() {
    var sequenceStart = heroBannerVideo.duration * 0.42;
    if (!heroSequenceStarted && Number.isFinite(sequenceStart) && heroBannerVideo.currentTime >= sequenceStart) {
      heroSequenceStarted = true;
      heroBannerTagline.classList.add('is-active');
      showHeroMessage(0);
    }
  });

  (function() {
    var root = document.documentElement;
    var stored = null;
    try { stored = localStorage.getItem('dara-theme'); } catch (e) {}
    var effective = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    root.setAttribute('data-theme', effective);
  })();
  document.getElementById('themeToggle').addEventListener('click', function() {
    var root = document.documentElement;
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('dara-theme', next); } catch (e) {}
  });

  document.querySelectorAll('[data-static-link]').forEach(function(a) {
    a.addEventListener('click', function(e) { e.preventDefault(); });
  });

  document.querySelectorAll('[data-scroll]').forEach(function(el) {
    el.addEventListener('click', function(e) {
      e.preventDefault();
      var target = document.getElementById(el.getAttribute('data-scroll'));
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      document.querySelectorAll('.nav-item.open').forEach(function(n) { n.classList.remove('open'); });
    });
  });
</script>
